<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title()} + ' — WikiNews Search'">Dettaglio Articolo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">WikiNews Search</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">Torna alla ricerca</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-3" th:text="${article.title()}">Titolo articolo</h1>

            <div class="mb-3 text-muted small">
                <span th:text="'ID: ' + ${article.identifier()}"></span>
                <span th:if="${article.effectiveYear().isPresent()}"
                      th:text="' · Anno effettivo: ' + ${article.effectiveYear().getAsInt()}"></span>
                <span th:if="${article.dateCreated() != null}"
                      th:text="' · Creato: ' + ${article.dateCreated()}"></span>
                <span th:if="${article.dateModified() != null}"
                      th:text="' · Modificato: ' + ${article.dateModified()}"></span>
            </div>

            <div class="mb-4" th:if="${!article.categories().isEmpty()}">
                <span th:each="cat : ${article.categories()}"
                      class="badge bg-info text-dark me-1" th:text="${cat}">Categoria</span>
            </div>

            <hr>

            <div class="mb-4" style="white-space: pre-line;" th:text="${article.content()}">
                Testo completo dell'articolo...
            </div>

            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                <a th:href="@{/}" class="btn btn-secondary">Torna ai risultati</a>
                <a th:if="${article.url() != null and !#strings.isEmpty(article.url())}"
                   th:href="${article.url()}" target="_blank" rel="noopener noreferrer"
                   class="btn btn-outline-primary">Visualizza fonte originale</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
